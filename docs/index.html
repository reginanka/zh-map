<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Мапа відключень — Житомирська область</title>
    <meta name="description" content="Інтерактивна мінімалістична мапа відключень електроенергії Житомирської області." />
    <meta name="theme-color" content="#06080e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Світло ЖТ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="map-shell">
      <div id="map" class="map-canvas" role="application" aria-label="Інтерактивна мапа відключень Житомирської області"></div>

      <!-- Кнопка перегляду ситуації по області (верхній лівий кут) -->
      <button id="situation-btn" class="situation-btn" type="button" aria-label="Переглянути ситуацію по області">
        <svg class="situation-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v18h18"></path>
          <path d="M18 17V9"></path>
          <path d="M13 17V5"></path>
          <path d="M8 17v-3"></path>
        </svg>
        <span>Ситуація</span>
        <span id="situation-btn-pct" class="situation-btn-pct" hidden></span>
      </button>

      <!-- Кнопка скидання виду -->
      <button id="reset-view-btn" class="reset-view-btn" type="button" title="Показати всю Житомирську область" aria-label="Показати всю Житомирську область">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span class="reset-view-label">Вся область</span>
      </button>

      <!-- Tooltip при наведенні (десктоп) -->
      <div id="hover-tooltip" class="glass-tooltip" role="status" aria-live="polite" hidden></div>

      <!-- Закріплена картка при кліку / тапі -->
      <aside id="selected-card" class="selected-card" aria-live="polite" hidden>
        <div class="selected-card-header">
          <div>
            <div id="selected-name" class="selected-name"></div>
            <div id="selected-hromada" class="selected-hromada"></div>
          </div>
          <button id="selected-close" class="selected-close" type="button" aria-label="Закрити картку">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div class="selected-metric-row">
          <span id="selected-swatch" class="selected-swatch"></span>
          <span id="selected-percent" class="selected-percent"></span>
          <span id="selected-status-text" class="selected-status-text"></span>
        </div>
      </aside>

      <!-- Компактна легенда та час оновлення (нижній лівий кут) -->
      <footer class="legend-panel" aria-label="Легенда та статус оновлення">
        <div class="legend-title">Освітлення населених пунктів</div>
        <div class="legend-gradient-wrap">
          <div class="legend-gradient" aria-hidden="true"></div>
          <div class="legend-ticks">
            <span>0%</span>
            <span>25%</span>
            <span>50%</span>
            <span>75%</span>
            <span>100%</span>
          </div>
        </div>
        <div class="legend-meta">
          <span>Житомирська обл.</span>
          <span aria-hidden="true">·</span>
          <span id="updated-at" class="updated-at">Оновлення...</span>
        </div>
        <div class="legend-disclaimer">Неофіційний проєкт · відкриті джерела, можливі неточності</div>
      </footer>

      <!-- Повноекранна / модальна панель ситуації по області -->
      <div id="situation-modal" class="situation-modal" role="dialog" aria-modal="true" aria-label="Ситуація з електропостачанням по області" hidden>
        <div class="situation-container">
          <div class="situation-header">
            <div>
              <div class="situation-headline">
                <span id="situation-oblast-pct" class="situation-oblast-pct">0%</span>
                <span class="situation-oblast-label">населених пунктів без світла по області</span>
              </div>
              <p id="situation-oblast-sub" class="situation-oblast-sub"></p>
            </div>
            <button id="situation-close" class="situation-close" type="button" aria-label="Закрити огляд ситуації">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>

          <div class="situation-progress-track">
            <div id="situation-oblast-bar" class="situation-progress-fill" style="width: 100%"></div>
          </div>

          <div class="situation-tabs" role="tablist">
            <button id="tab-raions" class="situation-tab is-active" type="button" role="tab" aria-selected="true">
              Світло за районами (РЕМ)
            </button>
            <button id="tab-villages" class="situation-tab" type="button" role="tab" aria-selected="false">
              Населені пункти (<span id="tab-villages-count">0</span>)
            </button>
          </div>

          <div id="panel-raions" class="situation-panel">
            <div class="situation-section-label">Рейтинг проблемності районів електричних мереж:</div>
            <div id="raions-list" class="situation-list"></div>
          </div>

          <div id="panel-villages" class="situation-panel" hidden>
            <div class="situation-filter-box">
              <svg class="situation-filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <input id="modal-village-search" class="situation-filter-input" type="search" placeholder="Фільтр за назвою села або району..." autocomplete="off" />
            </div>
            <div id="villages-list" class="situation-list"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
